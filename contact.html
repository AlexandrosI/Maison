<body>
    <div class="page-layout">
        <div id="site-header-placeholder"></div>

        <main>
            <section class="contact-section" aria-label="Contact form section">
                <div class="info-col">
                    <div class="contact-visual">
                        <img class="contact-visual-image" src="media/la-maison-vert-amande-seating-room.webp" alt="La Maison Vert Amande seating area">
                        <aside class="mission-card">
                            <img class="mission-card-logo" src="media/logo/bebop-joomla-logo.png" alt="La Maison Vert Amande logo">
                            <p>Long-term partnerships built on trust, transparency and measurable outcomes.</p>
                        </aside>
                    </div>
                </div>

                <div class="form-col">
                    <div class="form-container">
                        <h1 class="contact-form-title">Send us a message</h1>
                        <form action="send-mail.php" method="POST" id="contactForm">
                            <input type="hidden" name="lang" value="en">
                            <input type="hidden" name="redirect" value="contact.html">

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="name">Name</label>
                                    <input type="text" id="name" name="name" required placeholder="John Doe">
                                </div>
                                <div class="col-half form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                                </div>
                            </div>

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="phone">Phone</label>
                                    <input type="text" id="phone" name="phone" inputmode="numeric" pattern="[0-9]+" placeholder="Numbers only">
                                </div>
                                <div class="col-half form-group">
                                    <label for="guests">Number of guests</label>
                                    <input type="number" id="guests" name="guests" required min="1" step="1" inputmode="numeric">
                                </div>
                            </div>

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="arrival">ARRIVAL</label>
                                    <input type="date" id="arrival" name="arrival" required placeholder="mm/dd/yyyy">
                                </div>
                                <div class="col-half form-group">
                                    <label for="departure">DEPARTURE</label>
                                    <input type="date" id="departure" name="departure" required placeholder="mm/dd/yyyy">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input type="text" id="subject" name="subject" required placeholder="How can we help?">
                            </div>

                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
                            </div>

                            <button type="submit" id="submitBtn" data-loading-text="Sending...">Send message</button>
                            <div id="form-message" role="status" aria-live="polite"></div>
                        </form>
                    </div>
                </div>
            </section>

            <div id="site-footer-placeholder"></div>
        </main>
    </div>

    <script src="components.js"></script>
    <script src="send-mail.php?asset=form-handler"></script>
</body>
