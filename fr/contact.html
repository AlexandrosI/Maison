<body>
    <div class="page-layout">
        <div id="site-header-placeholder"></div>

        <main>
            <section class="contact-section" aria-label="Section contact">
                <div class="info-col">
                    <div class="contact-visual">
                        <img class="contact-visual-image" src="../media/la-maison-vert-amande-seating-room.webp" alt="Salon de La Maison Vert Amande">
                        <aside class="mission-card">
                            <img class="mission-card-logo" src="../media/logo/bebop-joomla-logo.png" alt="Logo de La Maison Vert Amande">
                            <p>Des partenariats durables fondes sur la confiance, la transparence et des resultats mesurables.</p>
                        </aside>
                    </div>
                </div>

                <div class="form-col">
                    <div class="form-container">
                        <h1 class="contact-form-title">Envoyez-nous un message</h1>
                        <form action="../send-mail.php" method="POST" id="contactForm">
                            <input type="hidden" name="lang" value="fr">
                            <input type="hidden" name="redirect" value="fr/contact.html">

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="name">Nom</label>
                                    <input type="text" id="name" name="name" required placeholder="Votre nom">
                                </div>
                                <div class="col-half form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" required placeholder="votre@email.com">
                                </div>
                            </div>

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="phone">Phone</label>
                                    <input type="text" id="phone" name="phone" inputmode="numeric" pattern="[0-9]+" placeholder="Numbers only">
                                </div>
                                <div class="col-half form-group">
                                    <label for="guests">Number of guests</label>
                                    <input type="number" id="guests" name="guests" required min="1" step="1" inputmode="numeric">
                                </div>
                            </div>

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="arrival">ARRIVAL</label>
                                    <input type="date" id="arrival" name="arrival" required placeholder="mm/dd/yyyy">
                                </div>
                                <div class="col-half form-group">
                                    <label for="departure">DEPARTURE</label>
                                    <input type="date" id="departure" name="departure" required placeholder="mm/dd/yyyy">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="subject">Sujet</label>
                                <input type="text" id="subject" name="subject" required placeholder="Comment pouvons-nous vous aider ?">
                            </div>

                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" rows="5" required placeholder="Ecrivez votre message ici..."></textarea>
                            </div>

                            <button type="submit" id="submitBtn" data-loading-text="Envoi...">Envoyer le message</button>
                            <div id="form-message" role="status" aria-live="polite"></div>
                        </form>
                    </div>
                </div>
            </section>

            <div id="site-footer-placeholder"></div>
        </main>
    </div>

    <script src="../components.js"></script>
    <script src="../send-mail.php?asset=form-handler"></script>
</body>
