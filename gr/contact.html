<body>
    <div class="page-layout">
        <div id="site-header-placeholder"></div>

        <main>
            <section class="contact-section" aria-label="Section επικοινωνίας">
                <div class="info-col">
                    <div class="contact-visual">
                        <img class="contact-visual-image" src="../media/la-maison-vert-amande-seating-room.webp" alt="Καθιστικό στο La Maison Vert Amande">
                        <aside class="mission-card">
                            <img class="mission-card-logo" src="../media/logo/La-maison-logo-green.png" alt="Λογότυπο La Maison Vert Amande">
                            <p>Μακροχρόνιες συνεργασίες βασισμένες στην εμπιστοσύνη, τη διαφάνεια και μετρήσιμα αποτελέσματα.</p>
                        </aside>
                    </div>
                </div>

                <div class="form-col">
                    <div class="form-container">
                        <h1 class="contact-form-title">Στείλτε μας μήνυμα</h1>
                        <form action="../send-mail.php" method="POST" id="contactForm">
                            <input type="hidden" name="lang" value="gr">
                            <input type="hidden" name="redirect" value="gr/contact.html">

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="name">Όνομα</label>
                                    <input type="text" id="name" name="name" required placeholder="Το όνομά σας">
                                </div>
                                <div class="col-half form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" required placeholder="Το email σας">
                                </div>
                            </div>

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="phone">Phone</label>
                                    <input type="text" id="phone" name="phone" inputmode="numeric" pattern="[0-9]+" placeholder="Numbers only">
                                </div>
                                <div class="col-half form-group">
                                    <label for="guests">Number of guests</label>
                                    <input type="number" id="guests" name="guests" required min="1" step="1" inputmode="numeric">
                                </div>
                            </div>

                            <div class="input-row">
                                <div class="col-half form-group">
                                    <label for="arrival">ARRIVAL</label>
                                    <input type="date" id="arrival" name="arrival" required placeholder="mm/dd/yyyy">
                                </div>
                                <div class="col-half form-group">
                                    <label for="departure">DEPARTURE</label>
                                    <input type="date" id="departure" name="departure" required placeholder="mm/dd/yyyy">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="subject">Θέμα</label>
                                <input type="text" id="subject" name="subject" required placeholder="Πώς μπορούμε να βοηθήσουμε;">
                            </div>

                            <div class="form-group">
                                <label for="message">Μήνυμα</label>
                                <textarea id="message" name="message" rows="5" required placeholder="Πληκτρολογήστε το μήνυμά σας εδώ..."></textarea>
                            </div>

                            <button type="submit" id="submitBtn" data-loading-text="Αποστολή...">Αποστολή μηνύματος</button>
                            <div id="form-message" role="status" aria-live="polite"></div>
                        </form>
                    </div>
                </div>
            </section>

            <div id="site-footer-placeholder"></div>
        </main>
    </div>

    <script src="../components.js"></script>
    <script src="../send-mail.php?asset=form-handler"></script>
</body>
